        .bg-darki {

        nav {

            z-index: 2;
        }

        .profile-name {

            font-weight: bold;
            font-size: 30px;

        .profile-title {
            text-align: center;
            margin-bottom: 12px;
        }

        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 24px;
        }

        .an {
            color: white;
            text-decoration: none;
            transition: 0.3s;
            font-size: 17px;
            padding: 5px;
        }

        .an:hover {
            background-color: #f5f5f5;
            color: navy !important;
            border-radius: 5px;
        }

        main {
            flex: 1;
            padding: 25px 15px;
        }

        .content-section {
            display: none;
            width: 75%;
            max-width: 950px;
            margin: auto;
        }

        .card-headi {
            background-color: #f5f5f5;
            color: navy;
            border-radius: 5px;
            padding: 12px;
        }

        #content {
            color: black;
            line-height: 1.7;
            padding: 25px;
            overflow-wrap: anywhere;
        }

        #content p {
            text-align: justify;
            margin-bottom: 15px;
        }

        #content ul {
            padding-left: 25px;
            margin-bottom: 18px;
        }

        #content li {
            padding-left: 4px;
            margin-bottom: 10px;
        }

        #content ul ul {
            margin-top: 8px;
        }

        #content a {
            color: #073b8c;
            overflow-wrap: anywhere;
        }

        .section-heading {
            color: #160b45;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 12px;
        }

        footer {
            padding: 12px;
            margin-top: auto;
        }

        footer p {
            margin: 0;

            .profile-title {
                font-size: 14px;
            }

            .menu {
                gap: 8px 12px;
            }

            .an {
                font-size: 15px;
            }

            .content-section {
                width: 100%;
            }

            main {
                padding: 15px 10px;
            }

            #content {
                padding: 18px;
                font-size: 15px;
            }

        @media (max-width: 400px) {
            .menu {
